worker_processes 1;
pid /opt/amigaiconmaker/.runtime/nginx.pid;
error_log /opt/amigaiconmaker/.runtime/error.log warn;
events { worker_connections 128; }
http {
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        text/plain md txt;
        image/png png;
        image/svg+xml svg;
        application/octet-stream info;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /opt/amigaiconmaker/.runtime/client_temp;
    proxy_temp_path /opt/amigaiconmaker/.runtime/proxy_temp;
    fastcgi_temp_path /opt/amigaiconmaker/.runtime/fastcgi_temp;
    uwsgi_temp_path /opt/amigaiconmaker/.runtime/uwsgi_temp;
    scgi_temp_path /opt/amigaiconmaker/.runtime/scgi_temp;
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /opt/amigaiconmaker;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        location ~ /\. { deny all; }
        location ~ ^/(deploy|scripts)/ { deny all; }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
